name: CI
on:
  push:
    branches: [main, feat/ai-segment-pipeline]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm run build
      - run: npx wrangler deploy --dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-radio-web
          path: dist/
          retention-days: 7
  deploy-private-worker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/ai-segment-pipeline'
    needs: check
    uses: ./.github/workflows/deploy-worker.yml
    secrets: inherit
