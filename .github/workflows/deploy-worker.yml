name: Deploy private Worker

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler d1 migrations apply personal-radio --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - id: deploy
        shell: bash
        run: |
          npx wrangler deploy | tee deploy.log
          echo "url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The Worker checks itself (database, migrations, storage, keys) at /join/health, which Access lets
      # through. A failed check fails the deploy; an address Access still guards only warns.
      - name: Health check
        env:
          URL: ${{ vars.RADIO_URL || steps.deploy.outputs.url }}
        run: |
          if [ -z "$URL" ]; then echo "::warning::No address for the health check (set the RADIO_URL variable)."; exit 0; fi
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o health.json -w '%{http_code}' --max-time 20 "${URL%/}/join/health" || true)
            if [ "$status" = 200 ] && grep -q '"ok":true' health.json; then echo "Healthy: $(cat health.json)"; exit 0; fi
            if [ "$status" = 503 ] && grep -q '"ok":false' health.json; then last="unhealthy: $(cat health.json)"; else last="HTTP $status"; fi
            sleep 10
          done
          if [ "${last#unhealthy}" != "$last" ]; then echo "::error::Health check $last"; exit 1; fi
          echo "::warning::Health check not reachable ($last); is /join excluded from Access on this address?"
